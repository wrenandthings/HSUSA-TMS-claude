# Render Blueprint for the hosted web version (web roadmap phase 3).
# In Render: New > Blueprint, pick this repository; Render reads this file.
# The owner types the two secret values into Render's form (sync: false);
# they are never stored in the repository.
services:
  - type: web
    name: readyhangar
    runtime: node
    plan: free            # spins down after 15 idle minutes; "starter" stays on
    branch: finch/web
    region: virginia
    buildCommand: npm ci --include=dev && npm run web:prepare
    startCommand: npm run web:serve
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Electron is only for the desktop app; skip its 100 MB download.
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      # Public site: no testing account; admin's first password from below.
      - key: TMS_PUBLIC_SITE
        value: "1"
      # The site is only served over HTTPS, so the sign-in cookie is Secure.
      - key: TMS_SECURE_COOKIES
        value: "1"
      # Supabase > Connect > Session pooler connection string (with your
      # database password filled in). Typed into Render by the owner.
      - key: DATABASE_URL
        sync: false
      # admin's starting password on the site (12+ characters), used once
      # when admin is first created and changed at first sign-in.
      - key: TMS_ADMIN_INITIAL_PASSWORD
        sync: false
